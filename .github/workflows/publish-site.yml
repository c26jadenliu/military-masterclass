name: Publish Military Masterclass Site

on:
  push:
    paths:
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch generated static files
        env:
          SITE_URL: https://kong-peer-breaking-alcohol.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "$SITE_URL/index.html" -o index.html
          curl -fsSL --retry 5 --retry-delay 3 "$SITE_URL/blog.html" -o blog.html
          curl -fsSL --retry 5 --retry-delay 3 "$SITE_URL/contact.html" -o contact.html
          touch .nojekyll
          if grep -E "coderedvibecode|drive[.]google|docs[.]google|16j-pjo|Source Folder|sourceUrl|embeddedfolderview|__cf_email__|/cdn-cgi/l/email-protection" index.html blog.html contact.html; then
            echo "Found blocked marker in generated public site" >&2
            exit 1
          fi
          grep -q "c26jadenliu/military-masterclass" index.html
          grep -q "https://c26jadenliu.github.io/military-masterclass/contact.html#sent" contact.html
          grep -q "const contactEmail" contact.html
      - name: Commit static site files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog.html contact.html .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add generated Military Masterclass site [skip ci]"
            git push
          fi
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html blog.html contact.html .nojekyll public/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
