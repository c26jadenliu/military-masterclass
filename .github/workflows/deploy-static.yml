name: Deploy complete curriculum

on:
  push:
    paths:
      - .github/workflows/deploy-static.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://wow-nest-companies-massage.trycloudflare.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages

      - name: Download generated pages
        run: |
          set -euo pipefail
          cd pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in index.html blog.html card-setup.html contact.html subscribe.html; do
            curl -fsSL "$SOURCE_URL/$file" -o "$file"
          done
          touch .nojekyll

      - name: Validate complete curriculum
        run: |
          set -euo pipefail
          cd pages
          python - <<'PY'
          from pathlib import Path
          import json, re, sys

          index = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="catalog-data" type="application/json">(.*?)</script>', index, re.S)
          if not match:
              sys.exit('catalog data missing')
          catalog = json.loads(match.group(1))
          expected = {'items': 33, 'text': 33, 'slides': 0, 'sheets': 0, 'resources': 0}
          if catalog.get('stats') != expected:
              sys.exit(f"unexpected catalog stats: {catalog.get('stats')}")

          titles = [item.get('title', '') for item in catalog.get('items', [])]
          missing = []
          for number in range(1, 31):
              found = any(re.match(rf'Lesson {number}(?:\D|$)', title) for title in titles)
              if number == 14:
                  found = found or 'Trip Example: Doha' in titles
              if not found:
                  missing.append(number)
          if missing:
              sys.exit(f'missing lessons: {missing}')
          if 'Lesson 3.5: Roth IRA' not in titles:
              sys.exit('Lesson 3.5 missing')
          if any(item.get('type') != 'Text' for item in catalog.get('items', [])):
              sys.exit('non-text curriculum item found')
          if sum(len(item.get('attachments', [])) for item in catalog.get('items', [])) != 5:
              sys.exit('attachment count changed')
          if any('\ufffd' in item.get('text', '') for item in catalog.get('items', [])):
              sys.exit('replacement character found in lesson text')

          setup = Path('card-setup.html').read_text(encoding='utf-8')
          statuses = re.findall(r'<tr data-status="(current|planned)"', setup)
          if len(statuses) != 27 or 'Authorized User: Citi Dividend' not in setup:
              sys.exit('card setup page changed unexpectedly')

          bad = re.compile(r'teams\.microsoft|sharepoint|drive\.google|content/source|\.teams-cache|C:\\Users\\jaden|\.pptx|Personal Card Strategy.*\.xlsx', re.I)
          for path in Path('.').glob('*.html'):
              if bad.search(path.read_text(encoding='utf-8', errors='ignore')):
                  sys.exit(f'private/source marker found in {path}')
          PY

      - name: Publish gh-pages
        run: |
          set -euo pipefail
          cd pages
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore complete lesson sequence"
          git push origin HEAD:gh-pages
