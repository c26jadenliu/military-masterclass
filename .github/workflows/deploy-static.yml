name: Deploy generated static site

on:
  push:
    paths:
      - .github/workflows/deploy-static.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://robot-interval-consultancy-better.trycloudflare.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish generated files
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add "$workdir" origin/gh-pages
            cd "$workdir"
            git checkout -B gh-pages
          else
            git worktree add "$workdir" --detach
            cd "$workdir"
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in index.html blog.html contact.html subscribe.html; do
            curl --fail --silent --show-error --location "$SOURCE_URL/$file" --output "$file"
          done
          touch .nojekyll
          if grep -R -E "teams\.microsoft|sharepoint|drive\.google|content/source|\.teams|api\.asm|us-prod\.asyncgw" .; then
            echo "Private source marker found in generated output"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish Teams-updated public site"
            git push origin gh-pages
          fi
